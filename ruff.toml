# Ruff configuration. Conservative rule set focused on real problems.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled case by case
    "B008",  # function calls in defaults (Streamlit/LangChain patterns)
]

[lint.per-file-ignores]
"tests/*" = ["B011"]
